services:
  backend:
    build: ./backend
    container_name: wikicraft-backend
    env_file: .env
    environment:
      PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: .
    container_name: wikicraft-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped